name: HorrorZ CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-22.04 # Versión fija de Ubuntu para prevenir errores futuros

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Run Prettier
        run: pnpm run format:check

      - name: Run ESLint
        run: pnpm run lint

      # Pruebas del frontend
      - name: Run Unit Tests Frontend
        working-directory: ./frontend
        run: pnpm run test:unit

      # Pruebas del backend
      - name: Run Unit Tests Backend
        working-directory: ./backend
        run: pnpm test


  build-and-push-docker:
    needs: test-and-lint 
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y publicar Frontend
        uses: docker/build-push-action@v5
        with:
          context: . 
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/horrorz-frontend:latest

      - name: Construir y publicar Backend
        uses: docker/build-push-action@v5
        with:
          context: . 
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/horrorz-backend:latest
