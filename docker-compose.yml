services:
  mongodb:
    image: mongo:8.0.17
    container_name: horrorz_db
    ports:
      - "27017:27017"
    environment:
      - TZ=America/Santiago
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
  backend:
    build:
      context: . 
      dockerfile: backend/Dockerfile
    container_name: horrorz_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
      - MONGO_URI=mongodb://mongodb:27017/horrorz 
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: . 
      dockerfile: frontend/Dockerfile
    container_name: horrorz_frontend
    ports:
      - "8080:80" 
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data: